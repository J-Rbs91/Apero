name: E2E live production write

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
      - name: Install Chromium
        run: npx playwright@1.61.1 install --with-deps chromium
      - name: Real browser E2E against production
        run: node tests/live-production-e2e.mjs
