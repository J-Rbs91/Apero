name: Patch functional E2E current UI

on:
  push:
    branches:
      - fix/stale-github-read-cache

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/stale-github-read-cache
      - name: Align hermetic E2E with current UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/functional/run.mjs')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'marker not found: {label}')
              s = s.replace(old, new, 1)

          replace_once(
              'async function fillCreateSlot(page, index, { date, time, location }) {',
              '''async function closeLocationSearchIfOpen(page) {
            const closeSearch = page.getByRole("button", { name: "Fermer la recherche" });
            if (await closeSearch.isVisible().catch(() => false)) {
              await closeSearch.click();
            }
          }

          async function fillCreateSlot(page, index, { date, time, location }) {''',
              'location helper',
          )
          replace_once(
              '  await slot.locator(".field--wide input").fill(location);\n}',
              '  await slot.locator(".field--wide input").fill(location);\n  await closeLocationSearchIfOpen(page);\n}',
              'close create location search',
          )

          replace_once(
              'async function voteOnInvite(page, inviteUrl, { blaze, votes, comment }) {',
              '''async function openDisclosure(page, title) {
            const disclosure = page.locator("details.disclose").filter({ hasText: title }).first();
            await disclosure.waitFor({ state: "visible", timeout: 15_000 });
            if (!(await disclosure.getAttribute("open"))) {
              await disclosure.locator("summary").click();
            }
            return disclosure;
          }

          async function voteOnInvite(page, inviteUrl, { blaze, votes, comment }) {''',
              'disclosure helper',
          )

          replace_once(
              '    await cards.nth(index).getByText(votes[index], { exact: true }).click();',
              '    await cards.nth(index).getByRole("radio", { name: votes[index] }).check();',
              'radio vote',
          )
          replace_once(
              '  await page.locator(".vote-form .slot").nth(1).getByText(VOTE_YES, { exact: true }).click();',
              '  await page.locator(".vote-form .slot").nth(1).getByRole("radio", { name: VOTE_YES }).check();',
              'edit vote radio',
          )

          if 'Répondre à l’invitation' not in s:
              raise SystemExit('marker not found: old submit labels')
          s = s.replace(
              'page.getByRole("button", { name: "Répondre à l’invitation" })',
              'page.getByRole("button", { name: /^(Envoyer|Enregistrer) ma réponse$/ })',
          )

          replace_once(
              '  const voteFormCount = await page.getByRole("button", { name: /^(Envoyer|Enregistrer) ma réponse$/ }).count();',
              '  const voteFormCount = await page.locator(".vote-form").count();',
              'readonly vote form',
          )

          replace_once(
              '  await waitVisible(page, page.getByText("Ton assemblée"), "L\'organisateur est identifié sur la page");',
              '  await waitVisible(page, page.getByText("Ton assemblée"), "L\'organisateur est identifié sur la page");\n  await openDisclosure(page, "Qui vient ?");',
              'organizer participant disclosure',
          )
          replace_once(
              '    "La première réponse de l\'invité est enregistrée",\n  );',
              '    "La première réponse de l\'invité est enregistrée",\n  );\n  await openDisclosure(page, "Qui vient ?");',
              'bob participant disclosure',
          )
          replace_once(
              '    "Le second invité vote, y compris sur le créneau contre-proposé",\n  );',
              '    "Le second invité vote, y compris sur le créneau contre-proposé",\n  );\n  await openDisclosure(page, "Qui vient ?");',
              'chantal participant disclosure',
          )

          replace_once(
              '  await form.locator(".field--wide input").fill("La Buvette Clandestine");',
              '  await form.locator(".field--wide input").fill("La Buvette Clandestine");\n  await closeLocationSearchIfOpen(page);',
              'counterproposal location',
          )

          replace_once(
              '  const deleteButton = page.getByRole("button", { name: "Annuler l’apéro" });',
              '  await openDisclosure(page, "Coulisses de l’organisation");\n  const deleteButton = page.getByRole("button", { name: "Annuler l’apéro" });',
              'organizer tools disclosure',
          )

          p.write_text(s)
          PY

          git diff --check
          git diff -- tests/functional/run.mjs

      - name: Commit E2E alignment
        shell: bash
        run: |
          if git diff --quiet -- tests/functional/run.mjs; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/functional/run.mjs
          git commit -m "test: align functional E2E with current UI"
          git push origin HEAD:fix/stale-github-read-cache
