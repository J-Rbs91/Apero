name: Deploy Vite app to GitHub Pages

# Publication is downstream of the CI proof for the exact main SHA.
# CI owns unit/server/functional validation; this workflow keeps only the
# deployment-specific configuration and Vite build. A manual redeploy is allowed
# only when the current main SHA already has a successful CI push run.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A newer validated main supersedes an older candidate that has not published
  # yet. The SHA gate below also refuses stale workflow_run events.
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}

    env:
      VITE_GITHUB_OWNER: j-rbs91
      VITE_GITHUB_REPO: Apero
      VITE_GITHUB_BRANCH: main
      VITE_APERO_STORAGE_MODE: api-vps
      VITE_APP_BASE_URL: https://j-rbs91.github.io/Apero
      VITE_APERO_API_BASE_URL: ${{ vars.VITE_APERO_API_BASE_URL }}

    steps:
      - name: Bind deployment to current validated main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          echo "deploy=false" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$CANDIDATE_SHA" != "$current_main" ]; then
            echo "Candidate $CANDIDATE_SHA is no longer current main ($current_main); nothing to deploy."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            conclusion="$(
              gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
                -f branch=main \
                -f event=push \
                -f head_sha="$CANDIDATE_SHA" \
                -f per_page=10 \
                --jq '.workflow_runs[0].conclusion // ""'
            )"
            if [ "$conclusion" != "success" ]; then
              echo "No successful CI push run exists for current main SHA $CANDIDATE_SHA." >&2
              exit 1
            fi
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "Deploying exact validated main SHA $CANDIDATE_SHA"

      - name: Checkout validated candidate
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.gate.outputs.candidate_sha }}
          persist-credentials: false

      - name: Verify API configuration
        if: steps.gate.outputs.deploy == 'true'
        run: |
          if [ -z "$VITE_APERO_API_BASE_URL" ]; then
            echo "::error title=VITE_APERO_API_BASE_URL absente::La variable de depot VITE_APERO_API_BASE_URL n'est pas definie. Definir la variable dans Settings > Secrets and variables > Actions > Variables, puis relancer ce workflow."
            exit 1
          fi
          echo "API apero raccordee : le build embarque une URL d'API publique."

      - name: Setup Node
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        if: steps.gate.outputs.deploy == 'true'
        run: npm ci

      # This build is intentionally retained: deployment injects the repository
      # variable used by the published bundle, so it is not interchangeable with
      # a generic CI artifact unless that configuration is proven identical.
      - name: Build Vite app for Pages
        if: steps.gate.outputs.deploy == 'true'
        run: npm run build

      - name: Configure GitHub Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload dist folder
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.deploy == 'true'
    environment:
      name: github-pages

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
