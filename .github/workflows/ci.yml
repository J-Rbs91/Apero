name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          VITE_GITHUB_OWNER: j-rbs91
          VITE_GITHUB_REPO: Apero
          VITE_GITHUB_BRANCH: main
          VITE_APERO_STORAGE_MODE: api-vps
          VITE_APP_BASE_URL: https://j-rbs91.github.io/Apero
          VITE_APERO_API_BASE_URL: https://panum.fr/_svc/a

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server tests
        working-directory: server
        run: npm test

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Install Chromium for functional E2E
        shell: bash
        run: |
          npx playwright@1.61.1 install --with-deps chromium
          CHROMIUM_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux*/chrome' | head -n 1)"
          if [ -z "$CHROMIUM_PATH" ]; then
            echo "::error::Chromium executable not found after Playwright install"
            exit 1
          fi
          echo "APERO_TEST_CHROMIUM=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: Functional E2E (GitHub backend)
        run: npm run test:functional
